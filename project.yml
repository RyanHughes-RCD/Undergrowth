name: Undergrowth
options:
  bundleIdPrefix: com.undergrowth
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  UndergrowthCore:
    path: Packages/UndergrowthCore
targets:
  Undergrowth:
    type: application
    platform: iOS
    sources:
      - path: App
      # Copied into the app bundle as a folder named "Resources" so the
      # content/sprite directory layout is preserved.
      - path: Resources
        type: folder
    dependencies:
      - package: UndergrowthCore
        product: UndergrowthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.undergrowth.app
        PRODUCT_NAME: Undergrowth
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Undergrowth
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  Undergrowth:
    build:
      targets:
        Undergrowth: all
